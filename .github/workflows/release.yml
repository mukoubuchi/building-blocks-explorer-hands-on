name: Release packages
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python setup/instructor/build_participant_zips.py
      - name: Attach packages to the prepared release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          gh release upload "$GITHUB_REF_NAME" \
            dist/building-blocks-explorer-workshop-en.zip \
            dist/building-blocks-explorer-workshop-ja.zip \
            --repo "$GITHUB_REPOSITORY" --clobber
