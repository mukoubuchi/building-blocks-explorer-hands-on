name: Deploy MkDocs to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['docs/**', 'mkdocs.yml', 'setup/instructor/requirements.txt', '.github/workflows/deploy-docs.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    # Private source does not imply private Pages; the owner enables this.
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r setup/instructor/requirements.txt
      - run: mkdocs build --strict
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - run: python lib/validate_docs.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
