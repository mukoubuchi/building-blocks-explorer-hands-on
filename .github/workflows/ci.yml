name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: setup/instructor/requirements.txt
      - name: Install documentation dependencies
        run: pip install -r setup/instructor/requirements.txt
      - name: Check shell syntax and style
        run: |
          bash -n lib/check_translation_sync.sh
          shellcheck lib/check_translation_sync.sh
      - name: Check Python and JavaScript syntax
        run: |
          python -m compileall -q lib setup/instructor
          for file in docs/javascripts/*.js; do node --check "$file"; done
      - name: Build the bilingual site
        run: mkdocs build --strict
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - name: Validate documentation
        run: python lib/validate_docs.py
      - name: Build participant packages
        run: python setup/instructor/build_participant_zips.py
